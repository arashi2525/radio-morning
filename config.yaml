# 番組の設定。このファイルを編集して push すれば、次回の配信から反映されます。

podcast:
  title: "朝のニュースラジオ"
  description: "毎朝6時、AIが主要ニュースを4分にまとめてお届けします。"
  author: "News Radio Bot"
  language: "ja"
  category: "News"          # Apple Podcasts のカテゴリ名
  # 公開URL。空なら GitHub Actions 上で https://<owner>.github.io/<repo> を自動設定
  base_url: ""
  # カバー画像のURL(1400〜3000pxの正方形 JPG/PNG)。docs/ に置いた場合は相対パスでも可
  cover_image: ""
  keep_episodes: 30         # これより古い回はMP3ごと削除(リポジトリ肥大化の防止)

# ジャンルとRSSソース。順番がそのまま番組内の順番になります。
genres:
  - name: "主要ニュース"
    max_items: 6            # このジャンルからClaudeに渡す記事数の上限
    sources:
      - name: "NHK 主要"
        url: "https://news.web.nhk/n-data/conf/na/rss/cat0.xml"
  - name: "経済"
    max_items: 4
    sources:
      - name: "NHK 経済"
        url: "https://news.web.nhk/n-data/conf/na/rss/cat5.xml"
  - name: "国際"
    max_items: 4
    sources:
      - name: "NHK 国際"
        url: "https://news.web.nhk/n-data/conf/na/rss/cat6.xml"
  - name: "テクノロジー"
    max_items: 4
    sources:
      - name: "ITmedia NEWS"
        url: "https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml"
      - name: "GIGAZINE"
        url: "https://gigazine.net/news/rss_2.0/"

fetch:
  lookback_hours: 24        # これより古い記事は無視
  max_summary_chars: 400    # RSSの概要文をこの文字数で切る(全文配信フィード対策)

script:
  model: "claude-opus-5-5"
  target_minutes: 4
  chars_per_minute: 290    # 読み上げ速度の目安。実際の尺がずれたらここを調整
  # 原稿の口調などへの追加指示(任意)
  style: "落ち着いた朝のラジオ番組のパーソナリティとして、です・ます調で親しみやすく。"

tts:
  voice: "ja-JP-NanamiNeural"   # 男性なら ja-JP-KeitaNeural。一覧: edge-tts --list-voices
  rate: "+0%"                   # 話速。例: "+10%", "-5%"
